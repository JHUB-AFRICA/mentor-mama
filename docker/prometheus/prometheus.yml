global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: mentormama-api
    metrics_path: /metrics
    dns_sd_configs:
      - names:
          - api
        type: A
        port: 8000
        refresh_interval: 10s

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

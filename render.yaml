services:
  - type: web
    name: mentormama-website
    env: static
    # Render's free tier is perfect for static React/Vite builds.
    # Render's free tier automatically installs pnpm v11 natively
    # We only need to tell it which workspace to build.
    buildCommand: pnpm --filter @mentormama/web build
    # Vite outputs the production build to the dist folder
    staticPublishPath: apps/web/dist
    # React uses client-side routing, so all paths must redirect to index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

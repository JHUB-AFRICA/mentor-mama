services:
  - type: web
    name: mentormama-website
    env: static
    # Render's free tier is perfect for static React/Vite builds.
    # pnpm is already available from the packageManager field in package.json,
    # so we only install dependencies and build the web workspace.
    buildCommand: pnpm install && pnpm --filter @mentormama/web build
    # Vite outputs the production build to the dist folder
    staticPublishPath: apps/web/dist
    # React uses client-side routing, so all paths must redirect to index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

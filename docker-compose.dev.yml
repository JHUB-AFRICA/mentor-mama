services:
  redis:
    image: redis:7-alpine
    container_name: mentormama-redis
    command: redis-server --appendonly yes
    ports:
      # 6379 is already used by another local service; expose MentorMAMA on 6380.
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: mentormama-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mentormama}
      POSTGRES_USER: ${POSTGRES_USER:-mentormama}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mentormama}
    ports:
      # Keep the host port aligned with backend/config/settings/base.py.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-mentormama} -d ${POSTGRES_DB:-mentormama}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      args:
        EXTRA_REQUIREMENTS: dev.txt
    container_name: mentormama-api
    command: sh /app/backend/dev-entrypoint.sh
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://${POSTGRES_USER:-mentormama}:${POSTGRES_PASSWORD:-mentormama}@postgres:5432/${POSTGRES_DB:-mentormama}
      REDIS_URL: redis://redis:6379/0
      USE_REDIS: "true"
      SECRET_KEY: ${SECRET_KEY:-local-development-only-change-before-deployment}
      DEBUG: "${DEBUG:-true}"
      ALLOWED_HOSTS: "*"
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      # console (print to the log) unless you set EMAIL_PROVIDER=resend and a RESEND_API_KEY in .env
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_SIGNING_SECRET: ${RESEND_SIGNING_SECRET:-}
      USE_MAILTRAP: "${USE_MAILTRAP:-false}"
      MAILTRAP_API_TOKEN: ${MAILTRAP_API_TOKEN:-}
      MAILTRAP_SANDBOX_ID: ${MAILTRAP_SANDBOX_ID:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-MentorMAMA <mentormama@sinapstechnology.tech>}
      AI_ENABLED: "${AI_ENABLED:-false}"
      AI_API_BASE_URL: ${AI_API_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_TEMPERATURE: "${AI_TEMPERATURE:-0.2}"
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
      EXPORT_ROOT: /var/lib/mentormama/exports
      PRIVATE_CONTENT_ROOT: /var/lib/mentormama/content-documents
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # Keep application code in sync without rebuilding after every backend change.
      - ./backend:/app/backend
      - export-data:/var/lib/mentormama/exports
      - content-document-data:/var/lib/mentormama/content-documents
    depends_on:
      # The API is not created until PostgreSQL and Redis report healthy.
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      args:
        EXTRA_REQUIREMENTS: dev.txt
    container_name: mentormama-worker
    # The image's HTTP check is for the API; a worker is healthy when it answers a Celery ping.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A config.celery inspect ping --timeout 5 -d celery@$$HOSTNAME | grep -q pong",
        ]
      interval: 60s
      timeout: 15s
      start_period: 40s
      retries: 3
    # watchfiles restarts the worker on code or template changes, so exports and emails never run stale code.
    command: watchfiles --filter default "celery -A config.celery worker --loglevel=INFO --concurrency=1" /app/backend/apps /app/backend/config
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://${POSTGRES_USER:-mentormama}:${POSTGRES_PASSWORD:-mentormama}@postgres:5432/${POSTGRES_DB:-mentormama}
      REDIS_URL: redis://redis:6379/0
      USE_REDIS: "true"
      SECRET_KEY: ${SECRET_KEY:-local-development-only-change-before-deployment}
      DEBUG: "${DEBUG:-true}"
      ALLOWED_HOSTS: "*"
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      USE_MAILTRAP: "${USE_MAILTRAP:-false}"
      MAILTRAP_API_TOKEN: ${MAILTRAP_API_TOKEN:-}
      MAILTRAP_SANDBOX_ID: ${MAILTRAP_SANDBOX_ID:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-MentorMAMA <mentormama@sinapstechnology.tech>}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
      EXPORT_ROOT: /var/lib/mentormama/exports
    volumes:
      - ./backend:/app/backend
      - export-data:/var/lib/mentormama/exports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      args:
        EXTRA_REQUIREMENTS: dev.txt
    container_name: mentormama-beat
    # Beat serves no HTTP and has no ping; its liveness is the container itself.
    healthcheck:
      disable: true
    command: watchfiles --filter default "celery -A config.celery beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule" /app/backend/apps /app/backend/config
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://${POSTGRES_USER:-mentormama}:${POSTGRES_PASSWORD:-mentormama}@postgres:5432/${POSTGRES_DB:-mentormama}
      REDIS_URL: redis://redis:6379/0
      USE_REDIS: "true"
      SECRET_KEY: ${SECRET_KEY:-local-development-only-change-before-deployment}
      DEBUG: "${DEBUG:-true}"
      ALLOWED_HOSTS: "*"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
    restart: unless-stopped

  portal:
    image: node:24-alpine
    container_name: mentormama-portal
    profiles: ["full"]
    working_dir: /workspace
    command: >-
      sh -c "corepack enable && pnpm install --frozen-lockfile &&
      pnpm --filter @mentormama/portal dev --host 0.0.0.0"
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    ports:
      - "${PORTAL_PORT:-5173}:5173"
    volumes:
      - .:/workspace
      - portal-root-node-modules:/workspace/node_modules
      - portal-app-node-modules:/workspace/apps/portal/node_modules
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  export-data:
  content-document-data:
  portal-root-node-modules:
  portal-app-node-modules:

services:
  postgres:
    image: postgres:16-alpine
    container_name: mentormama-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mentormama}
      POSTGRES_USER: ${POSTGRES_USER:-mentormama}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mentormama}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-mentormama} -d ${POSTGRES_DB:-mentormama}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:

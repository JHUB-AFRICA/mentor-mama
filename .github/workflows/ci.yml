name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint, migrations, and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mentormama
          POSTGRES_USER: mentormama
          POSTGRES_PASSWORD: mentormama
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U mentormama -d mentormama"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgres://mentormama:mentormama@127.0.0.1:5432/mentormama
      SECRET_KEY: ci-only-not-a-production-secret
      USE_REDIS: "false"
      DEBUG: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Ruff
        run: ruff check apps tests

      - name: Django system check
        run: python manage.py check

      - name: Check migration drift
        run: python manage.py makemigrations --check --dry-run

      - name: Run backend tests
        run: |
          mkdir -p test-results
          pytest --create-db -v --junitxml=test-results/backend-junit.xml

      - name: Upload backend test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/test-results/backend-junit.xml
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: ${{ matrix.app }} lint, typecheck, and build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web, portal]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint ${{ matrix.app }}
        run: pnpm --filter @mentormama/${{ matrix.app }} lint

      - name: Typecheck ${{ matrix.app }}
        run: pnpm --filter @mentormama/${{ matrix.app }} exec tsc --noEmit

      - name: Build ${{ matrix.app }}
        run: pnpm --filter @mentormama/${{ matrix.app }} build

  portal-e2e:
    name: Portal browser end-to-end smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mentormama
          POSTGRES_USER: mentormama
          POSTGRES_PASSWORD: mentormama
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U mentormama -d mentormama"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgres://mentormama:mentormama@127.0.0.1:5432/mentormama
      SECRET_KEY: ci-only-not-a-production-secret
      USE_REDIS: "false"
      DEBUG: "false"
      CI: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          python -m pip install --upgrade pip
          pip install -r backend/requirements/dev.txt

      - name: Install Chromium and system dependencies
        run: pnpm --filter @mentormama/portal exec playwright install --with-deps chromium

      - name: Apply database migrations
        working-directory: backend
        run: python manage.py migrate --noinput

      - name: Run browser journeys
        run: >-
          pnpm --filter @mentormama/portal exec playwright test
          e2e/auth-portal.spec.ts
          e2e/content-module-authoring.spec.ts
          e2e/menta-buddy.spec.ts
          --grep-invert "programme admin can sign in"

      - name: Upload browser report, traces, screenshots, and video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-e2e-${{ github.run_id }}
          path: |
            apps/portal/playwright-report/
            apps/portal/test-results/
          if-no-files-found: warn
          retention-days: 14

  production-config:
    name: Validate production Compose configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose --env-file .env.production.example -f docker-compose.prod.yml config --quiet

  production-images:
    name: Build production ${{ matrix.image }} image
    runs-on: ubuntu-latest
    needs: [backend, frontend, production-config]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            dockerfile: docker/backend/Dockerfile
          - image: web
            dockerfile: docker/web/Dockerfile
          - image: portal
            dockerfile: docker/portal/Dockerfile
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          tags: mentormama/${{ matrix.image }}:${{ github.sha }}
          push: false
          load: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  ci-summary:
    name: Required CI summary
    if: always()
    runs-on: ubuntu-latest
    needs: [backend, frontend, portal-e2e, production-config, production-images]
    steps:
      - name: Record job results
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          E2E_RESULT: ${{ needs.portal-e2e.result }}
          CONFIG_RESULT: ${{ needs.production-config.result }}
          IMAGES_RESULT: ${{ needs.production-images.result }}
        run: |
          {
            echo "## CI results"
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| Backend lint, migrations, and tests | ${BACKEND_RESULT} |"
            echo "| Web and portal lint, typecheck, and build | ${FRONTEND_RESULT} |"
            echo "| Portal browser end-to-end smoke | ${E2E_RESULT} |"
            echo "| Production Compose configuration | ${CONFIG_RESULT} |"
            echo "| Production image builds | ${IMAGES_RESULT} |"
          } >> "$GITHUB_STEP_SUMMARY"

          for result in "$BACKEND_RESULT" "$FRONTEND_RESULT" "$E2E_RESULT" "$CONFIG_RESULT" "$IMAGES_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "CI did not pass: ${result}" >&2
              exit 1
            fi
          done
